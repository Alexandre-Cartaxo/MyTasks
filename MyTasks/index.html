<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MyTasks</title>
  <link rel="shortcut icon" href="img/myTasksFavicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Tela de carregamento -->
  <div id="loading" class="center" style="display: none;">
    <img src="img/loading.gif" alt="Carregando..." />
  </div>

  <div id="app">
    <!-- Logo -->
    <div class="center">
      <img id="logo" src="img/myTasks.png" alt="Logo MyTasks" />
    </div>

    <!-- Área para adicionar tarefas (visível para usuários autenticados) -->
    <div id="addTarefa" class="center startHidden">
      <form id="todoForm">
        <h3 id="todoFormTitle">Adicionar tarefa:</h3>
        <label for="name">Tarefa: </label>
        <input type="text" id="name" placeholder="Digite a tarefa" required maxlength="30" />
        <button type="submit" id="submitTodoForm">Adicionar tarefa</button>
      </form>
      <hr />
    </div>

    <!-- Lista de tarefas e busca -->
    <div id="todoList" class="startHidden">
      <h3 id="todoCount">Carregando tarefas...</h3>
      <div id="buscas" class="center">
        <label for="search">Buscar: </label>
        <input type="text" placeholder="Buscar" id="search" />
      </div>
      <ul id="ulTodoList"></ul>
    </div>

    <!-- Área de autenticação para usuários não logados -->
    <div id="auth" class="center">
      <form id="authForm">
        <h3 id="authFormTitle">Acessar sua conta</h3>
        <br />
        <p>
          <label for="email">E-mail: </label>
          <input type="email" id="email" name="email" placeholder="E-mail" required />
        </p>
        <p>
          <label for="password">Senha: </label>
          <input type="password" id="password" name="password" placeholder="Senha" required />
        </p>
        <button type="submit" id="submitAuthForm">Acessar</button>
      </form>

      <br />

      <p id="passwordReset">
        Esqueceu a senha?
        <button class="alternative" type="button" onclick="sendPasswordResetEmail()">Redefinir senha</button>
      </p>

      <p id="register">
        Não possui uma conta?
        <button type="button" onclick="toggleToRegister()" class="alternative">Cadastrar</button>
      </p>

      <p id="access" class="startHidden">
        Já possui uma conta?
        <button type="button" onclick="toggleToAccess()" class="alternative">Acesse</button>
      </p>

      <br />

      <p>
        Ou acesse usando:<br />
        <img
          class="icon"
          src="img/google.png"
          alt="Autenticação pelo Google"
          onclick="signInWithGoogle()"
          role="button"
          tabindex="0"
        />
        <img
          class="icon"
          src="img/github.png"
          alt="Autenticação pelo GitHub"
          onclick="signInWithGitHub()"
          role="button"
          tabindex="0"
        />
        <img
          class="icon"
          src="img/facebook.png"
          alt="Autenticação pelo Facebook"
          onclick="signInWithFacebook()"
          role="button"
          tabindex="0"
        />
      </p>
    </div>

    <!-- Conteúdo para usuários autenticados -->
     <div id="userContent" class="startHidden">
      <hr />
      <div id="userInfo" class="center">
        <img id="userImg" alt="Foto do usuário" />
        <p id="userName"></p>
        <p id="userEmail"></p>
        <p id="emailVerified"></p>

        <div id="sendEmailVerificationDiv">
          <button class="alternative" type="button" onclick="sendEmailVerification()">Verificar e-mail</button>
        </div>

        <br />
        <button class="alternative" type="button" onclick="updateUserName()">Atualizar nome</button>
        <button class="alternative" type="button" onclick="signOut()">Sair</button>
        <button class="danger" type="button" onclick="deleteUserAccount()">Excluir conta</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/todo.js"></script>
</body>
</html>
